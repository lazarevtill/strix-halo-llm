name: verify

# What CI can and cannot do here. There is no GPU, no model, and no private eval
# content on a runner -- evals/code/tasks.json, tests/, reference/ and
# evals/tools/cases.jsonl are gitignored on purpose (docs/PUBLISHING.md), so
# nothing below may import or score them. This workflow checks the parts that are
# true regardless of hardware: syntax, the rescore self-test, and the launcher
# argument contract.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: bash syntax + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: bash -n every shell script
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r f; do
            bash -n "$f"
            echo "  ok  $f"
            found=$((found + 1))
          done < <(find scripts -name '*.sh' -type f | sort)
          # A find that silently matches nothing is a green check that proves nothing.
          [ "$found" -gt 0 ] || { echo "no *.sh found under scripts/ -- did the tree move?" >&2; exit 1; }

      # PINNED. The runner's preinstalled shellcheck is not the version anyone develops against,
      # and they disagree: 0.11.0 accepts `cmd && act || true` while an older one raises SC2015 on
      # it. An unpinned linter turns "CI is green" into a statement about the runner image rather
      # than about this repo -- the same reason every benchmark here carries its build number.
      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - --strip-components=1 -C /usr/local/bin "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version

      - name: shellcheck
        run: shellcheck scripts/linux/*.sh scripts/macos/*.sh

  python:
    name: python compile + rescore self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: py_compile
        run: python -m py_compile evals/*.py evals/code/*.py

      # A real self-test, not a smoke import: it asserts defines() and the
      # strict/rescued/best turn selection against the failure shapes that
      # produced bugs 12 and 10. Needs no GPU, no Docker, no private cases.
      - name: rescore self-test
        run: python evals/test-rescore.py

  powershell:
    name: PowerShell 5.1 parse
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # `shell: powershell` is Windows PowerShell 5.1; `pwsh` would be 7.x and would
      # happily parse `&&`, ternaries and `??`, none of which run on the target.
      # 5.1 is what ships with Windows, which is the whole reason these scripts avoid them.
      - name: Parse every .ps1
        shell: powershell
        run: |
          $bad = 0
          # @() and foreach, not a ForEach-Object pipeline: a counter incremented in a
          # pipeline block is exactly the kind of 5.1 scoping question this job exists to
          # avoid arguing about.
          $files = @(Get-ChildItem -Path scripts, evals -Recurse -Filter *.ps1)
          if ($files.Count -eq 0) { Write-Host "no .ps1 found -- did the tree move?"; exit 1 }
          foreach ($f in $files) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              $bad++
              Write-Host ("  FAIL {0}" -f $f.FullName)
              foreach ($e in $parseErrors) {
                Write-Host ("        line {0}: {1}" -f $e.Extent.StartLineNumber, $e.Message)
              }
            } else {
              Write-Host ("  ok   {0}" -f $f.FullName)
            }
          }
          Write-Host ("{0} file(s) parsed, {1} with errors" -f $files.Count, $bad)
          if ($bad -gt 0) { exit 1 }

  harness:
    name: eval harness self-test
    runs-on: ubuntu-latest
    # The harness scores itself here on the PUBLIC EXAMPLE SUITE (evals/code/examples/), which is
    # committed precisely so this is possible: the measured cases are gitignored, and until the
    # example suite existed run-code-eval.py raised FileNotFoundError at import on any fresh clone,
    # so smoke.py -- the script the README offers as the reason to trust its numbers -- could not
    # run for anyone but the author. Nothing here scores a model; it proves the sandbox
    # discriminates good code from bad and that every turn prompt is satisfiable by its reference.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build the eval sandbox
        run: docker build -f evals/code/Dockerfile.sandbox -t llm-eval-sandbox evals/code

      # Exit codes are meaningful and must not be collapsed: 0 = verified, 1 = a check genuinely
      # failed, 2 = the sandbox was unreachable so NOTHING was scored. CI must fail on 2 as well --
      # a run that measured nothing is not a pass -- but the distinction is the point of bug 9.
      - name: smoke.py
        run: python evals/code/smoke.py

  launcher-contract:
    name: launcher argument contract
    runs-on: ubuntu-latest
    # WHY BEHAVIOURAL ASSERTIONS AND NOT JUST LINTING. A formatting change once turned
    # `KV_QUANT=0; shift` into `KV_QUANT=0 shift` in the argument parser. Without the
    # semicolon that is an environment assignment scoped to `shift`, so --no-kv-quant
    # parsed cleanly, exited 0, and quietly did nothing. `bash -n` accepted it and
    # shellcheck reported nothing -- both are correct, because the mutant is valid bash.
    # Only running the launcher and reading the argv it would exec catches that class.
    # LLAMA_BIN=/bin/echo satisfies the executable check; --dry-run prints the argv and exits.
    steps:
      - uses: actions/checkout@v5

      - name: Assert the flags the launchers actually emit
        run: |
          # `set +e` FIRST, and it is load-bearing. GitHub invokes this block as `bash -e {0}`, so
          # errexit is already on before the script's own `set` runs: the first assertion that
          # deliberately expects a non-zero exit (the launcher refusing a directory it cannot
          # choose from) killed the step before `rc=$?` could be read, and the job reported a
          # failure with no failing assertion in the log. Verifying this file locally with plain
          # `bash` did not reproduce it -- the shell flags were the difference.
          set +e
          set -uo pipefail
          FAIL=0
          ok()  { printf '  ok    %s\n' "$1"; }
          bad() { printf '  FAIL  %s\n' "$1"; FAIL=1; }
          # `case` rather than [[ =~ ]] so flag text matches literally, not as a regex.
          has() { case "$2" in *"$1"*) return 0 ;; *) return 1 ;; esac; }
          want()   { if has "$1" "$2"; then ok "$3"; else bad "$3 -- '$1' missing"; fi; }
          wantno() { if has "$1" "$2"; then bad "$3 -- '$1' present"; else ok "$3"; fi; }

          ONE="$(mktemp -d)";   : > "${ONE}/only-model.gguf"
          TWO="$(mktemp -d)";   : > "${TWO}/model-a.gguf"; : > "${TWO}/model-b.gguf"
          EMPTY="$(mktemp -d)"

          dry() {  # dry <script> <models-dir> [extra args...]
            local script="$1" models="$2"; shift 2
            MODELS_DIR="$models" LLAMA_BIN=/bin/echo bash "$script" --dry-run "$@" 2>/dev/null
          }

          echo "linux/run-solo.sh:"
          LX="$(dry scripts/linux/run-solo.sh "$ONE")"
          want   '--ubatch-size 256'   "$LX" 'a) -ub defaults to the measured gfx1151 256'
          want   '--cache-type-k q8_0' "$LX" 'b) KV cache defaults to q8_0 (k)'
          want   '--cache-type-v q8_0' "$LX" 'b) KV cache defaults to q8_0 (v)'
          want   '-lm none'            "$LX" 'c) -lm none, the --no-mmap replacement'
          wantno '--no-mmap'           "$LX" 'c) deprecated --no-mmap is gone'
          want   "${ONE}/only-model.gguf" "$LX" 'd) the sole model in MODELS_DIR is selected'

          LXNK="$(dry scripts/linux/run-solo.sh "$ONE" --no-kv-quant)"
          wantno '--cache-type-k' "$LXNK" 'b) --no-kv-quant removes --cache-type-k'
          wantno '--cache-type-v' "$LXNK" 'b) --no-kv-quant removes --cache-type-v'

          echo "macos/run-solo.sh:"
          MC="$(dry scripts/macos/run-solo.sh "$ONE")"
          want   '--ubatch-size 512'   "$MC" 'a) -ub stays 512 on Metal, NOT the gfx1151 256'
          want   '--cache-type-k q8_0' "$MC" 'b) KV cache defaults to q8_0 (k)'
          want   '--cache-type-v q8_0' "$MC" 'b) KV cache defaults to q8_0 (v)'
          wantno '--no-mmap'           "$MC" 'c) deprecated --no-mmap is gone'
          want   "${ONE}/only-model.gguf" "$MC" 'd) the sole model in MODELS_DIR is selected'

          MCNK="$(dry scripts/macos/run-solo.sh "$ONE" --no-kv-quant)"
          wantno '--cache-type-k' "$MCNK" 'b) --no-kv-quant removes --cache-type-k'
          wantno '--cache-type-v' "$MCNK" 'b) --no-kv-quant removes --cache-type-v'

          echo "model selection refuses to guess, and refuses to hang:"
          for s in scripts/linux/run-solo.sh scripts/macos/run-solo.sh; do
            if MODELS_DIR="$EMPTY" LLAMA_BIN=/bin/echo bash "$s" --dry-run >/dev/null 2>&1; then
              bad "e) $s accepted an empty MODELS_DIR"
            else
              ok "e) $s exits non-zero on an empty MODELS_DIR"
            fi

            # Under systemd, launchd or CI there is no terminal to answer the picker.
            # A read on a closed stdin returns instantly, so an unguarded prompt loop
            # spins at full tilt rather than failing -- hence the timeout, not just a
            # non-zero check.
            timeout 20 env MODELS_DIR="$TWO" LLAMA_BIN=/bin/echo \
              bash "$s" --dry-run >/dev/null 2>&1 </dev/null
            rc=$?
            case $rc in
              0)   bad "f) $s picked a model with no terminal to ask at" ;;
              124) bad "f) $s HUNG on 2 models with stdin closed" ;;
              *)   ok  "f) $s exits $rc on 2 models with stdin closed" ;;
            esac
          done

          echo "linux/run-router.sh:"
          # Fixtures are empty files: KNOWN models are matched by filename and never opened, so
          # nothing here needs real weights. RT = the shipped ornith15 shape (model + projector +
          # DFlash draft) plus a text-only, no-spec model; NODRAFT = the same without the draft.
          RT="$(mktemp -d)"
          : > "${RT}/Ornith-1.5-35B-Q6_K.gguf"; : > "${RT}/mmproj-Ornith-1.5-35B-BF16.gguf"
          : > "${RT}/Ornith-1.5-35B-A3B-DFlash-Q8_0.gguf"; : > "${RT}/Qwen3-Coder-Next-UD-Q4_K_XL.gguf"
          NODRAFT="$(mktemp -d)"
          : > "${NODRAFT}/Ornith-1.5-35B-Q6_K.gguf"; : > "${NODRAFT}/mmproj-Ornith-1.5-35B-BF16.gguf"
          DRAFTONLY="$(mktemp -d)"; : > "${DRAFTONLY}/Ornith-1.5-35B-A3B-DFlash-Q8_0.gguf"
          section() {  # section <label> <preset text>: just that model's [label] block
            printf '%s\n' "$2" | awk -v want="[$1]" '
              { t = $0; sub(/^[ \t]+/, "", t) }
              t ~ /^\[/ { on = (t == want) } on'
          }
          rm -f scripts/linux/router-models.generated.ini

          RR="$(dry scripts/linux/run-router.sh "$RT" --models ornith15,coder --parallel 2 --per-slot-ctx 262144)"
          O15="$(section ornith15 "$RR")"
          want   'metrics = 1'               "$RR"  'g) every child exposes /metrics'
          want   'parallel = 2'              "$RR"  'h) --parallel 2 reaches the preset'
          want   'ctx-size = 524288'         "$RR"  'h) --per-slot-ctx 262144 x 2 slots = ctx-size 524288'
          want   'ubatch-size = 1024'        "$O15" 'i) ornith15 carries its measured ubatch-size 1024'
          wantno 'ubatch-size = 256'         "$O15" 'i) ...and the common 256 is suppressed, not duplicated'
          want   'spec-type = draft-dflash'  "$O15" 'j) ornith15 speculates with its DFlash draft'
          want   'DFlash-Q8_0.gguf'          "$O15" 'j) spec-draft-model resolves into MODELS_DIR'
          want   'mmproj = '                 "$O15" 'j) ornith15 keeps its vision projector'
          if [ -e scripts/linux/router-models.generated.ini ]; then
            bad 'l) --dry-run wrote the live preset into the repo'
          else
            ok  'l) --dry-run leaves the live preset alone'
          fi

          RRNS="$(dry scripts/linux/run-router.sh "$RT" --models ornith15 --no-spec)"
          wantno 'spec-'                     "$RRNS" 'm) --no-spec leaves no spec-* line'
          want   'ubatch-size = 1024'        "$RRNS" 'm) --no-spec keeps the non-spec tuning'

          RRND="$(dry scripts/linux/run-router.sh "$NODRAFT" --models ornith15)"
          wantno 'spec-'                     "$RRND" 'n) a missing draft drops every spec-* line'
          want   'ubatch-size = 1024'        "$RRND" 'n) ...but keeps ubatch-size 1024'

          RRDD="$(dry scripts/linux/run-router.sh "$RT" --models ornith15,ornith15)"
          n15="$(printf '%s\n' "$RRDD" | grep -c '\[ornith15\]')"
          if [ "$n15" = 1 ]; then ok 'o) --models a,a emits one section'; else bad "o) --models a,a emitted $n15 sections"; fi

          # The DFlash file must not be OFFERED: with only a draft on disk there is nothing to serve.
          if MODELS_DIR="$DRAFTONLY" LLAMA_BIN=/bin/echo bash scripts/linux/run-router.sh --dry-run >/dev/null 2>&1; then
            bad 'k) a dir holding only a DFlash draft was treated as servable'
          else
            ok  'k) a dir holding only a DFlash draft has nothing servable'
          fi
          AVAIL="$(MODELS_DIR="$RT" LLAMA_BIN=/bin/echo bash scripts/linux/run-router.sh --dry-run --models nosuch 2>&1)"
          want   'Available:'                "$AVAIL" 'k) an unknown --models name lists what is available'
          wantno 'dflash'                    "$AVAIL" 'k) ...and the list has no dflash entry'

          # DISCOVERED (not KNOWN) models: spec comes from the gguf header. The match sits at byte 0
          # of a 3 MB file on purpose -- `head -c 3000000 | grep -q` SIGPIPEs head there, and under
          # pipefail that read as "no MTP head". Only a Linux pipe buffer reproduces it.
          AD="$(mktemp -d)"
          { printf 'nextn_predict_layers'; head -c 3000000 /dev/zero; } > "${AD}/Mtpmodel-Q4_K_M.gguf"
          : > "${AD}/Plain-Q4_K_M.gguf"
          RA="$(dry scripts/linux/run-router.sh "$AD" --models mtpmodel,plain)"
          want   'spec-type = draft-mtp'     "$(section mtpmodel "$RA")" 'p) an MTP head in the gguf header auto-enables draft-mtp'
          want   'ubatch-size = 256'         "$(section plain "$RA")"    'p) a plain discovered model gets the common defaults'
          wantno 'spec-'                     "$(section plain "$RA")"    'p) ...and no speculation'
          RANS="$(dry scripts/linux/run-router.sh "$AD" --models mtpmodel,plain --no-spec)"
          wantno 'spec-'                     "$RANS" 'p) --no-spec also drops an auto-detected draft-mtp'

          rm -rf "$ONE" "$TWO" "$EMPTY" "$RT" "$NODRAFT" "$DRAFTONLY" "$AD"
          echo
          if [ "$FAIL" -eq 0 ]; then echo 'launcher contract: ALL PASS'; else echo 'launcher contract: FAILURES'; fi
          exit "$FAIL"
